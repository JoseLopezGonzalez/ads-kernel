# MATRIZ-F5.yml
#
# LA MATRIZ CANONICA DE F5. Una fila por obligacion, con su estado inequivoco.
#
# QUE ES. Un artefacto DERIVADO: cada fila cita la sede superior de la que sale y no
# crea autoridad. Su clase de zona es DERIVADA, declarada en
# docs/canonico/FUENTES-CANONICAS.yml.
#
# QUE NO ES. No es norma, no es un gate, no es una certificacion y no aprueba nada.
# Ninguna fila puede citarse como enmienda ni como decision tomada.
#
# LOS IDENTIFICADORES DE ESTADO se escriben aqui EXACTAMENTE como los nombra el encargo
# del Owner, con sus tildes, para que no existan dos grafias del mismo identificador.
# Es la leccion de PN-16 y PN-18, aplicada a este fichero.

version: 1

descripcion: >
  Matriz de obligaciones de F5, derivada del corpus canonico y de la sede unica de las
  presiones normativas. Una fila por obligacion, con estado, propietario, dependencia,
  artefacto de salida, criterio de aceptacion y prueba prevista.

derivacion:
  censo_de_presiones_vigentes: >
    grep '^## `PN-' docs/evolucion/11-ARQUITECTURA-INTEGRADA.md | grep -vc 'RETIRADA\|FUSIONADA'
  lista_de_presiones_vigentes: >
    grep '^## `PN-' docs/evolucion/11-ARQUITECTURA-INTEGRADA.md | grep -v 'RETIRADA\|FUSIONADA'
  externos_con_propietario_y_fase: >
    awk '/^## Lo que esta fase NO puede corregir/,/^### /' docs/evolucion/11-ARQUITECTURA-INTEGRADA.md
    | grep -oE '^\| `F-[0-9]+`'
  contratos_de_f6: >
    grep -cE '^\| `V6-[0-9]+` \|' docs/evolucion/11-ARQUITECTURA-INTEGRADA.md
  nota: >
    NINGUN cardinal de esta matriz se escribe a mano. El validador docs/f5/validar-f5.py
    deriva el censo de presiones del arbol y exige que la matriz lo cubra entero.

entregables:
  - id: F5-A
    titulo: resolver una a una las presiones normativas vigentes
    autoridad: el Owner, sobre propuesta redactada
  - id: F5-B
    titulo: la seccion (g), disposicion fisica del estado durable
    autoridad: el Owner
  - id: F5-C
    titulo: la norma de gobierno Git del repositorio de CONTROL, en esa misma seccion (g)
    autoridad: el Owner
  - id: F5-D
    titulo: la norma que habilita la RAIZ EXTERNA DE CONFIANZA
    autoridad: el Owner
  - id: F5-E
    titulo: las correcciones editoriales obligatorias sobre material aprobado
    autoridad: F5, con aprobacion del Owner
  - id: F5-F
    titulo: la nota de vigencia en el documento de trabajo del Owner
    autoridad: el Owner
  - id: F5-G
    titulo: la decision sobre las reglas del kernel constitucional presionadas por los macrocircuitos
    autoridad: el Owner

criterios_de_aceptacion:
  - id: A1
    texto: >
      cada presion VIGENTE tiene, o una ENMIENDA APROBADA con fecha y autoridad, o una
      RETIRADA MOTIVADA. Ninguna queda «pendiente» sin acto
  - id: A2
    texto: >
      ninguna enmienda se aplica sin aprobacion expresa del Owner, y ninguna se aplica
      silenciosamente sobre material aprobado
  - id: A3
    texto: >
      la seccion (g) existe, esta aprobada y cubre las materias que su fuente le reservo
  - id: A4
    texto: >
      la norma de identidad separada y evidencia externa existe, y el contrato que dependia
      de ella deja de estar BLOQUEADO POR DEPENDENCIA
  - id: A5
    texto: >
      la checklist editorial esta aplicada entera, con la prueba posterior que cada fila fija
  - id: A6
    texto: >
      NINGUN hallazgo vivo se declara SUPERADO por haberse redactado una enmienda
  - id: A7
    texto: >
      la bateria del corpus sigue en verde, y la huella del kernel no cambia salvo donde una
      enmienda aprobada lo ordene

estados_validos:
  - APLICADO_POR_O23
  - EJECUTADO_EN_F5
  - DETERMINADO_Y_EJECUTABLE
  - BORRADOR_DETERMINADO_PENDIENTE_DE_APROBACIÓN
  - ELECCIÓN_REAL_DEL_OWNER
  - BLOQUEADO_POR_OTRA_DECISIÓN
  - DEUDA_DE_F6
  - FUERA_DE_ALCANCE

# ===========================================================================
# LAS FILAS. Una por obligacion de F5, mas las filas de FRONTERA que declaran
# que NO pertenece a F5, para que la separacion F5/F6 sea explicita y no tacita.
#
# decision_owner: SI  ->  la fila no se cierra sin un acto del Owner
#                 NO  ->  la fila la cierra F5 sin acto nuevo del Owner
# ===========================================================================
filas:

  # --- F5-B · la seccion (g) · LA PRIMERA PUERTA ---------------------------
  - id: F5-OB-01
    entregable: F5-B
    presion: PN-1
    requisito_de_origen: >
      (a) a.9 delega la disposicion fisica a la seccion (g), y a.11 declara G26/JOURNAL
      PENDIENTE hasta disenar memoria, eventos y recuperacion en (g)
    fuente_superior: docs/rediseno/a-CAPACIDADES-APROBADA.md
    sede_vigente: docs/evolucion/11-ARQUITECTURA-INTEGRADA.md
    seccion_sede: "16 · PN-1"
    sede_de_la_enmienda: docs/rediseno/ · seccion (g) nueva, con aviso en (a) a.9
    resultado_exigido: >
      aprobar la disposicion fisica del estado durable como seccion normativa (g) del mismo
      grado que (a) y (b), o como enmienda que la sustituya
    dependencia: ninguna. Es la primera puerta del grafo de construccion
    propietario: Owner
    tipo_de_accion: APROBACION_DE_SECCION_NORMATIVA_NUEVA
    decision_owner: SI
    decision_id: D-01
    estado: APLICADO_POR_O23
    artefacto: docs/rediseno/g-ESTADO-DURABLE-APROBADA.md
    borrador_de_origen: docs/f5/borradores/B-01-SECCION-G.md
    criterio_aceptacion: [A1, A2, A3]
    prueba_prevista: >
      que la seccion (g) exista como sede vigente y cubra las trece materias que su fuente
      le reservo, derivadas de a.9, de la ampliacion de PN-1 y de O16; y que el nodo [1]
      del grafo deje de estar declarado BLOQUEADO

  # --- F5-C · el gobierno Git del control repo, DENTRO de (g) --------------
  - id: F5-OB-02
    entregable: F5-C
    presion: PN-11
    requisito_de_origen: >
      el gobierno Git del REPOSITORIO DE CONTROL no tiene sede normativa; C7 gobierna las
      fuentes y E2.4 cierra la via de derivar de G29 el gobierno del control repo
    fuente_superior: docs/rediseno/DECISIONES-Y-CONTRADICCIONES.md
    seccion_sede: "2 · O16"
    sede_vigente: docs/evolucion/11-ARQUITECTURA-INTEGRADA.md
    sede_de_la_enmienda: la seccion (g), como apartado. Fijado por O16 y NO reabierto
    resultado_exigido: >
      un apartado de (g) que fije la tabla de propiedad del control repo y las decisiones
      que presupone. C7 no se modifica; F6 deriva C8
    dependencia: F5-OB-01. Su sede ES la seccion (g), que aun no existe
    propietario: Owner
    tipo_de_accion: APARTADO_DE_SECCION_NORMATIVA
    decision_owner: SI
    decision_id: D-01
    estado: APLICADO_POR_O23
    artefacto: docs/rediseno/g-ESTADO-DURABLE-APROBADA.md
    borrador_de_origen: docs/f5/borradores/B-01-SECCION-G.md
    criterio_aceptacion: [A1, A2, A3]
    prueba_prevista: >
      que exista un apartado de (g) con la tabla de propiedad, y que O16 quede materializada
      en sus tres extremos: sede en (g), C8 derivado en F6, C7 intacto
    nota: >
      La SEDE ya la resolvio O16 y NO se vuelve a preguntar. Lo que queda es redaccion
      determinada. El valor por defecto de adaptador.publicacion_control_repo TAMPOCO se
      pregunta: esperando-owner esta fijado, y la ausencia nunca significa publica

  # --- F5-D · la raiz externa de confianza ---------------------------------
  - id: F5-OB-03
    entregable: F5-D
    presion: PN-19
    requisito_de_origen: >
      O18 hace OBLIGATORIO en F6 un verificador externo con identidad de escritura separada
      y evidencia fuera del arbol, y ninguna sede aprobada las contempla
    fuente_superior: docs/owner/ADS-OWNER-RESOLUCIONES.md
    seccion_sede: "O18, ratificada en su proyeccion por O19"
    sede_vigente: docs/evolucion/11-ARQUITECTURA-INTEGRADA.md
    sede_de_la_enmienda: la que el Owner elija entre (g)/C8, ampliar C7, o sede nueva
    resultado_exigido: >
      una sede normativa vigente que fije (i) la identidad de escritura separada con su
      titular, (ii) donde vive la evidencia fuera del arbol comprobado, y (iii) quien la
      custodia
    dependencia: >
      ninguna para decidir. Si el Owner elige (g)/C8, su aplicacion depende de F5-OB-01
    propietario: Owner
    tipo_de_accion: ELECCION_DE_SEDE_Y_REDACCION
    decision_owner: SI
    decision_id: D-02
    estado: APLICADO_POR_O23
    artefacto: docs/rediseno/g-ESTADO-DURABLE-APROBADA.md
    borrador_de_origen: docs/f5/borradores/B-02-RAIZ-EXTERNA.md
    criterio_aceptacion: [A1, A2, A4]
    prueba_prevista: >
      que V6-16 pase de CONTRATO_BLOQUEADO_POR_DEPENDENCIA a CONTRATO_CONSTRUIBLE sin que
      ningun otro campo de su fila cambie, segun la condicion exacta de desbloqueo de 20.4;
      y la prueba negativa que PN-19 fija: falsear un veredicto desde dentro del arbol y
      exigir que la atestacion externa lo detecte
    nota: >
      El CONTENIDO esta ratificado por el Owner en O18 y NO se vuelve a preguntar. Lo unico
      abierto es la SEDE. Lo NO reversible es la obligacion: retirar (c) es volver a la
      alternativa (a), que el Owner rechazo expresamente

