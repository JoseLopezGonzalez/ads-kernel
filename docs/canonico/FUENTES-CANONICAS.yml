# FUENTES-CANONICAS.yml
#
# REGISTRO CENTRAL DE SEDES CANONICAS DE ADS.
#
# Una materia normativa tiene UNA sola sede. Los demas documentos la ENLAZAN y no la
# vuelven a formular. Este fichero es la sede de esa correspondencia, y es validable
# mecanicamente con `docs/canonico/validar-fuentes-canonicas.py`.
#
# Se escribe sin tildes a proposito: es un fichero de datos, no prosa.

version: 1

descripcion: >
  Registro de sedes canonicas, autoridades y clasificacion del corpus de ADS, consolidado
  antes de iniciar F5. No crea autoridad: la registra y la enlaza.

base_de_consolidacion:
  commit: ab35659a191432f9e652e173c6acb8b0ae98bcd3
  referencia: review/f4c-ratificacion-o22-lectura-integral-20260902
  fecha: "2026-09-02"

# ---------------------------------------------------------------------------
# REGLA DE PRECEDENCIA. De mayor a menor. Cuando dos fuentes difieren, manda la de arriba.
# Su desarrollo en prosa vive en docs/canonico/03-GOBIERNO-Y-AUTORIDAD.md, que es su sede.
# ---------------------------------------------------------------------------
regla_de_precedencia:
  orden:
    - resolucion-del-owner
    - material-aprobado
    - contrato-o-esquema-del-kernel
    - arquitectura-entregada-por-f4c
    - proyeccion-derivada
  texto: >
    La sede canonica de las resoluciones del Owner es la autoridad. Una parafrasis nunca
    amplia el texto canonico. El material aprobado se cambia por enmienda, y la unica fase
    con autoridad para editarlo es F5. Los contratos y esquemas del kernel instancian el
    material aprobado y no lo contradicen. La arquitectura entregada por F4c es derivada:
    donde proyecta una resolucion, manda la resolucion. Toda proyeccion posterior es
    derivada y no crea obligacion.
  sede_en_prosa: docs/canonico/03-GOBIERNO-Y-AUTORIDAD.md

# ---------------------------------------------------------------------------
# PROHIBICIONES. Son las reglas contra la redundancia, en forma comprobable.
# ---------------------------------------------------------------------------
prohibiciones:
  - id: PRH-1
    texto: >
      Una materia normativa NO puede tener dos sedes. Los demas documentos enlazan; no
      vuelven a formular la regla.
  - id: PRH-2
    texto: >
      Un documento de GATE, un DICTAMEN, un MANIFIESTO o un CORRIGENDUM NO puede ser la SEDE
      de una materia vigente, ni requisito de lectura para implementar. Se registran como
      EVIDENCIA y se citan como acto, nunca como norma.
  - id: PRH-3
    texto: >
      Ningun estado de fase se copia en mas de una sede del corpus canonico. Su sede unica
      es docs/canonico/03-GOBIERNO-Y-AUTORIDAD.md.
  - id: PRH-4
    texto: >
      Ninguna lista de hallazgos se copia fuera de su sede. La del corpus canonico es
      docs/canonico/06-DEUDA-Y-LIMITACIONES-VIGENTES.md.
  - id: PRH-5
    texto: >
      Ningun cardinal que pueda crecer se escribe a mano. Se deriva con un comando
      publicado junto a la afirmacion.
  - id: PRH-6
    texto: >
      Ningun contrato o esquema tecnico se copia en el corpus canonico. Se enlaza y se
      explica su papel.

# ---------------------------------------------------------------------------
# LIMITACIONES DECLARADAS DE ESTE REGISTRO. Se dicen porque ocultarlas seria el defecto.
# ---------------------------------------------------------------------------
limitaciones_declaradas:
  - id: LIM-1
    texto: >
      TRES materias vigentes tienen su UNICA sede dentro del registro reanudable de la
      iniciativa, que es un checkpoint: la clasificacion vigente de las condiciones de
      cierre, el estado y la condicion de cierre de M-04, y la matriz de los hallazgos del
      octavo gate por fase. Son MAT-044, MAT-045 y MAT-046.
    por_que_no_se_corrige_aqui: >
      Trasladar esas sedes seria mover materia adjudicada y tocar el objeto de una clase de
      hallazgo que sigue abierta. Esta consolidacion no lo hace: enlaza la seccion exacta y
      no la copia.
    efecto_para_quien_implementa: >
      NINGUNO para saber que construir: docs/canonico/06-DEUDA-Y-LIMITACIONES-VIGENTES.md
      publica, para cada una, su propietario, su fase y su condicion de cierre. El
      checkpoint solo hace falta para auditar el reparto completo, que no es tarea de
      implementacion.
  - id: LIM-2
    texto: >
      La materia MAT-011 —las resoluciones del Owner anteriores a la sede canonica— vive en
      un registro derivado y no en la sede. Es una orden expresa del Owner y se cumple
      literalmente: no se reconstruyen ni se inventan sus textos.

estados_validos: [vigente, historico, evidencia, derivada]

clases_validas:
  - AUTORIDAD_SUPERIOR
  - CANONICA_OPERATIVA
  - CONTRATO_O_ESQUEMA_TECNICO
  - HISTORICA
  - EVIDENCIA
  - DERIVADA
  - NO_APLICABLE_A_IMPLEMENTACION

# ---------------------------------------------------------------------------
# CLASIFICACION POR ZONA. Se evalua EN ORDEN: gana la primera cuyo patron case.
# Se clasifica por ZONA y no fichero a fichero para que la clasificacion no caduque
# cuando el corpus crezca.
# ---------------------------------------------------------------------------
zonas:
  - patron: '^docs/owner/ADS-OWNER-RESOLUCIONES\.md$'
    clase: AUTORIDAD_SUPERIOR
    motivo: sede canonica de las resoluciones del Owner, APPEND-ONLY
  - patron: '^docs/owner/ADS-ARQUITECTURA-MULTIREPO-APROBADA\.md$'
    clase: AUTORIDAD_SUPERIOR
    motivo: decision del Owner aprobada para implementacion
  - patron: '^docs/owner/ADS-IDEAS-PENDIENTES-MULTIREPO\.md$'
    clase: NO_APLICABLE_A_IMPLEMENTACION
    motivo: documento de trabajo del Owner; declara materia abierta y no autoriza a implementar
  - patron: '^docs/rediseno/(a-CAPACIDADES-APROBADA|b-RECORRIDO-APROBADA|g-ESTADO-DURABLE-APROBADA|a-ENMIENDA-E1-ENC|a-ENMIENDA-E2-MULTIREPO|a-ENMIENDA-E[3-9]-[A-Z0-9-]+)\.md$'
    clase: AUTORIDAD_SUPERIOR
    motivo: >
      especificacion normativa aprobada por el Owner; se cambia por enmienda. Incluye la
      seccion (g), adoptada por la resolucion O23, y las enmiendas E3 en adelante que F5
      emite bajo esa misma resolucion
  - patron: '^docs/rediseno/a-EQUIPOS-v[0-9]-(RECHAZADA|SUPERADA)\.md$'
    clase: HISTORICA
    motivo: versiones rechazadas o superadas, conservadas por trazabilidad
  - patron: '^docs/rediseno/(AUDITORIA-INDEPENDIENTE-LOCAL|CORRECCIONES-POST-AUDITORIA|REVISION-ADVERSARIAL)\.md$'
    clase: EVIDENCIA
    motivo: informes de auditoria y revision, cerrados
  - patron: '^docs/rediseno/00-MAPA\.md$'
    clase: HISTORICA
    motivo: mapa de la linea anterior frente al principio gobernante
  - patron: '^docs/rediseno/'
    clase: DERIVADA
    motivo: indices, registros de decision y checkpoints del redisenio
  - patron: '^docs/canonico/'
    clase: CANONICA_OPERATIVA
    motivo: corpus canonico vigente; puerta de entrada de F5 y F6
  - patron: '^docs/f5/borradores/'
    clase: NO_APLICABLE_A_IMPLEMENTACION
    motivo: >
      borradores de enmienda de F5, NO APROBADOS. No son norma, no autorizan a implementar
      y ninguno es citable como vigente hasta que el Owner resuelva su decision asociada
  - patron: '^docs/f5/'
    clase: DERIVADA
    motivo: >
      area de trabajo de F5: la matriz de obligaciones, el paquete de decisiones del Owner
      y la trazabilidad, todos DERIVADOS de sus sedes superiores; no crean autoridad
  - patron: '^docs/evolucion/[0-9][0-9]-.*\.md$'
    clase: EVIDENCIA
    motivo: documentos numerados de la iniciativa; los de gate son INMUTABLES
  - patron: '^docs/evolucion/verificacion/'
    clase: EVIDENCIA
    motivo: aparato de verificacion de F4c; manifiestos, corrigendum e instrumental
  - patron: '^docs/evolucion/(ADS-NEXT-OWNER-BRIEF|PROMPT-ARRANQUE-ADS-NEXT)\.md$'
    clase: AUTORIDAD_SUPERIOR
    motivo: directiva del Owner y su orden de ejecucion, escritas en su voz
  - patron: '^docs/evolucion/ADS-PENDIENTES-DE-IMPLEMENTACION-Y-DISCUSION\.md$'
    clase: NO_APLICABLE_A_IMPLEMENTACION
    motivo: material temporal de evolucion; no es normativa vigente
  - patron: '^docs/evolucion/'
    clase: DERIVADA
    motivo: indice y checkpoint de la iniciativa; proyecciones del estado
  - patron: '^kernel/operativo/pruebas/evidencia/'
    clase: EVIDENCIA
    motivo: salidas publicadas por el runner canonico; no se editan a mano
  - patron: '^kernel/operativo/pruebas/.*-generado\.md$'
    clase: DERIVADA
    motivo: artefactos regenerados desde el corpus
  - patron: '^kernel/KERNEL\.md$'
    clase: AUTORIDAD_SUPERIOR
    motivo: constitucion en prosa; solo su propia lista de derogaciones la deroga
  - patron: '^kernel/operativo/(esquemas|contratos)/'
    clase: CONTRATO_O_ESQUEMA_TECNICO
    motivo: la forma de cada tipo canonico y los contratos transversales
  - patron: '^kernel/operativo/validadores/'
    clase: CONTRATO_O_ESQUEMA_TECNICO
    motivo: los validadores ejecutables y su manifiesto canonico
  - patron: '^kernel/(operativo|templates)/'
    clase: CANONICA_OPERATIVA
    motivo: contenido operativo instalable
  - patron: '^kernel/'
    clase: CONTRATO_O_ESQUEMA_TECNICO
    motivo: plantillas, version y changelog del release
  - patron: '^packs/legacy-'
    clase: HISTORICA
    motivo: packs retirados, conservados por trazabilidad; no se instalan
  - patron: '^packs/'
    clase: CANONICA_OPERATIVA
    motivo: especializacion por clase de proyecto
  - patron: '^tooling/'
    clase: CONTRATO_O_ESQUEMA_TECNICO
    motivo: lo ejecutable hoy fuera del kernel
  - patron: '^(README|START_HERE)\.md$'
    clase: DERIVADA
    motivo: puertas de entrada del repositorio; proyectan lo que otras sedes fijan
  - patron: '^\.gitignore$'
    clase: NO_APLICABLE_A_IMPLEMENTACION
    motivo: configuracion de herramienta

