#   seccion             cuando la sede es un fichero grande y la materia vive en una parte
#   estado              vigente | historico | evidencia | derivada
#   autoridad_superior  la fuente que esta sede no puede contradecir, cuando exista
#   acto_declarativo    el acto que declaro el estado, cuando la materia es un ESTADO
#   fuentes_tecnicas    esquemas, contratos o codigo concreto que la implementan
# ---------------------------------------------------------------------------
