          sed -i 's/^          //' /tmp/mensaje.txt
          printf '\n  sha de entrada  %s\n  run             %s\n' "${{ github.sha }}" "${{ github.run_id }}" >> /tmp/mensaje.txt
          git commit -q -F /tmp/mensaje.txt
          echo "el push sin --force ES el compare-and-swap: si la rama se movio, se rechaza"
