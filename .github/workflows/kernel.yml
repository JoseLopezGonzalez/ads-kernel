name: kernel

# LA PRIMERA CI DE ESTE REPOSITORIO, Y LLEGA TARDE.
#
# El kernel generico se validaba a mano, en la maquina de quien tocara. Eso explica los
# dos defectos que UP-00 y UP-04 destaparon: los dos eran INVISIBLES desde Linux —un
# nombre de fichero imposible en Windows, y una guarda que en Windows no reejecuta— y
# ninguno se vio hasta que un Windows de verdad intento ejecutar algo.
#
# Aqui se comprueba lo que una maquina sola no puede: los TRES sistemas, y la condicion
# que exige un contenedor.
#
# NO despliega nada. NO necesita credencial ninguna, y NO se introduce ninguna.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # ===========================================================================
  linux:
    name: Bateria del kernel (Linux, con Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # la evidencia se contrasta contra el blob de HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Requisitos
        run: python3 -m pip install --quiet pyyaml

      # LA OCTAVA CONDICION DE `O26`, EJERCIDA DE VERDAD.
      #
      # `condicion_6` exige un ejecutor con identidad de sistema distinta y el control repo
      # montado de SOLO LECTURA. Sin contenedor se declaraba «no ejercible» y el veredicto
      # se quedaba en 7 de 8 — que es una forma honrada de no demostrarlo, pero no es
      # demostrarlo. El runner de Actions trae Docker, asi que aqui SI se ejerce.
      #
      # El laboratorio es desechable y no toca nada: `--rm` lo borra al salir, `--network
      # none` lo deja sin red, `--user 4242:4242` le da un UID que no es el del runtime, y
      # el repositorio entra montado `:ro`. No hay credenciales en ninguna parte y no hay
      # acceso a produccion: el contenedor no puede salir a la red.
      - name: Docker disponible, y que se vea
        run: |
          docker info --format 'servidor {{.ServerVersion}} · cgroup {{.CgroupVersion}} · driver {{.CgroupDriver}}'
          docker pull --quiet alpine:latest

      - name: "O26 · las OCHO condiciones, la sexta dentro de un contenedor"
        run: |
          set -e
          python3 docs/evolucion/verificacion/ejercer-o26-condiciones.py | tee /tmp/o26.txt
          if ! grep -q '8 de 8 condiciones SATISFECHAS · 0 no ejercibles · 0 no satisfechas' /tmp/o26.txt; then
            echo "FALLA: no son 8 de 8. Lo que dice el ejercitador:"
            tail -5 /tmp/o26.txt
            exit 1
          fi
          echo "OK: 8 de 8 condiciones SATISFECHAS"

      - name: Limpieza del laboratorio
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f
          rm -rf /tmp/ads-* || true
          echo "contenedores restantes: $(docker ps -aq | wc -l)"

      - name: Rutas portables
        run: python3 -I -S -E -X ads_aislado=1 kernel/operativo/validadores/comprobar_rutas_portables.py

      - name: Integridad, evidencia y registro de pruebas
        run: |
          set -e
          ./tooling/kernel-status.sh
          python3 -I -S -E -X ads_aislado=1 kernel/operativo/validadores/comprobar_integridad.py
          python3 -I -S -E -X ads_aislado=1 kernel/operativo/validadores/comprobar_evidencia.py

      # `T309` EXIGE CONTENCION FUERTE, Y UN RUNNER DE ACTIONS NO LA DA.
      #
      # Comprueba que un punto ejecutable ACTIVA la politica de contencion y
      # contiene a su bisnieto. Necesita cgroup v2 DELEGADO o un espacio de
      # nombres de PID usable, y el runner no concede ninguno de los dos: el
      # subgrupo se crea pero la tarea no acaba dentro, y `unshare -Urpf` falla
      # escribiendo en /proc. La causa la publica el propio backend, con su
      # codigo: `CONTENCION_FUERTE_NO_DISPONIBLE`.
      #
      # SE INTENTO EL OTRO ENTORNO, Y ES PEOR. Correr la bateria dentro de un
      # contenedor privilegiado con el cgroup del anfitrion da la contencion,
      # pero corre como `root`, y como `root` varios escenarios dejan de medir
      # lo suyo —un permiso retirado no retira nada— y otros chocan con la
      # propiedad del arbol montado: 6 fallos y 16 errores, todos ajenos a lo
      # que se queria comprobar. Cambiar un rojo informativo por veintidos
      # rojos falsos no es arreglarlo.
      #
      # ASI QUE SE DECLARA, Y SE EXIGE LA DECLARACION. El paso NO tolera «que
      # falle algo»: exige que falle EXACTAMENTE `T309` y que su causa sea la
      # ausencia de contencion fuerte. Cualquier otro fallo, o `T309` fallando
      # por otro motivo, pone el paso en rojo. Una excepcion que no comprueba
      # su propio motivo es una excepcion que envejece en silencio.
      - name: "El aislamiento de arranque (T398 y T399), con T309 declarado"
        run: |
          set +e
          python3 -I -S -E -X ads_aislado=1 \
                  kernel/operativo/runtime/pruebas/test_integridad_y_evidencia.py \
                  > /tmp/aislamiento.txt 2>&1
          codigo=$?
          set -e
          tail -40 /tmp/aislamiento.txt

          # T398 y T399 —lo que UP-04 anade— tienen que HABER CORRIDO y NO estar
          # entre los fallos. Se comprueban las dos cosas: que se ejecutaron
          # —su nombre aparece— y que ninguna linea de FAIL o ERROR los nombra.
          # No se busca «... ok» en la linea del nombre: unittest lo escribe en
          # la linea del docstring, y buscarlo donde no esta puso este paso en
          # rojo con la bateria entera correcta menos la limitacion declarada.
          for escenario in T398 T399; do
            if ! grep -q "test_${escenario}_" /tmp/aislamiento.txt; then
              echo "FALLA: $escenario ni siquiera se ejecuto"; exit 1
            fi
            if grep -qE "^(FAIL|ERROR): test_${escenario}_" /tmp/aislamiento.txt; then
              echo "FALLA: $escenario se ejecuto y NO paso"; exit 1
            fi
            echo "OK: $escenario se ejecuto y no esta entre los fallos"
          done

          if [ "$codigo" -eq 0 ]; then
            echo "OK: la bateria entera paso, T309 incluida"; exit 0
          fi

          # Si falla, tiene que fallar SOLO T309 y por SU motivo.
          fallos=$(grep -c '^FAIL:\|^ERROR:' /tmp/aislamiento.txt || true)
          if [ "$fallos" -ne 1 ]; then
            echo "FALLA: $fallos fallos, y solo se declara la limitacion de T309"; exit 1
          fi
          if ! grep -q '^FAIL: test_T309_' /tmp/aislamiento.txt; then
            echo "FALLA: el unico fallo NO es T309"; grep '^FAIL:\|^ERROR:' /tmp/aislamiento.txt; exit 1
          fi
          if ! grep -q 'CONTENCION_FUERTE_NO_DISPONIBLE' /tmp/aislamiento.txt; then
            echo "FALLA: T309 fallo por un motivo DISTINTO de la falta de contencion"; exit 1
          fi
          echo ""
          echo "LIMITACION DECLARADA Y COMPROBADA:"
          echo "  T309 no es ejercible en un runner de GitHub Actions. Requisito exacto:"
          echo "  cgroup v2 delegado, o un espacio de nombres de PID usable. El backend lo"
          echo "  publica como CONTENCION_FUERTE_NO_DISPONIBLE. Todo lo demas paso."

  # ===========================================================================
  windows:
    name: Validadores invocados DIRECTAMENTE en Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Requisitos
        shell: pwsh
        run: python -m pip install --quiet pyyaml

      # `UP-04` · LO QUE ESTE TRABAJO EXISTE PARA IMPEDIR.
      #
      # La guarda `G-03` reejecutaba con `os.execve`. En Windows esa primitiva no existe:
      # la emulacion lanza un proceso NUEVO y mata el padre en el acto, asi que quien
      # llamaba recogia un codigo de salida y NI UNA LINEA de salida. Lo tenian los 52
      # puntos que importan la guarda, en la plataforma declarada prioritaria.
      #
      # Aqui se invocan validadores REALES, sin banderas —que es como los invoca una
      # persona— y se exige lo que antes no se cumplia: salida NO VACIA y codigo correcto,
      # tanto en exito como en fallo, en pwsh 7 y en Windows PowerShell 5.1, y tambien
      # desde una ruta con espacios y caracteres no ASCII.
      - name: "UP-04 · pwsh 7"
        shell: pwsh
        run: .\.github\comprobar-up04.ps1

      - name: "UP-04 · Windows PowerShell 5.1"
        shell: powershell
        run: .\.github\comprobar-up04.ps1

      # `UP-08` Y `UP-09` · EL AYUDANTE DE CREDENCIAL, EJERCIDO AQUI Y NO SOLO
      # AGUAS ABAJO.
      #
      # El bootstrap instala un ayudante de credencial y nada lo ejecutaba: se
      # comprobaba que el fichero existia. Eso dejo pasar dos defectos seguidos
      # —una lista de repositorios autorizados que no se ejercia NUNCA porque
      # `git` no manda el camino sin `credential.useHttpPath`, y un descifrado
      # que fallaba SIEMPRE por un salto de linea y se callaba en su `catch`—.
      # Los dos se descubrieron en la CI de una instancia, no aqui, que es donde
      # vive el defecto. Esto lo corrige: se instala con un alcance conocido, se
      # le pone una credencial de LABORATORIO y se le pregunta como le pregunta
      # `git`. Sin red, sin credencial real.
      - name: "Ayudante de credencial · pwsh 7"
        shell: pwsh
        run: .\.github\comprobar-ayudante.ps1

      - name: "Ayudante de credencial · Windows PowerShell 5.1"
        shell: powershell
        run: .\.github\comprobar-ayudante.ps1

  # ===========================================================================
  macos:
    name: Bateria minima (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Requisitos
        run: python3 -m pip install --quiet pyyaml

      - name: Rutas portables e integridad
        run: |
          set -e
          python3 -I -S -E -X ads_aislado=1 kernel/operativo/validadores/comprobar_rutas_portables.py
          ./tooling/kernel-status.sh

      - name: "La reejecucion por execve sigue intacta en POSIX"
        run: |
          set -e
          salida=$(python3 kernel/operativo/validadores/comprobar_rutas_portables.py)
          codigo=$?
          echo "$salida" | tail -2
          test $codigo -eq 0
          echo "$salida" | grep -q "T153" || { echo "FALLA: salida vacia o sin T153"; exit 1; }
          echo "OK: reejecuta, habla y devuelve 0"
