  preguntas: {tipo: lista, de: texto, min: 1}
  muestra_referencias: {tipo: texto, min: 10}
  brainstorming: {tipo: texto, min: 10}
  consulta_especialista: {tipo: texto, min: 10}
  confirmacion: {tipo: texto, min: 10}
  crea_item: {tipo: texto, min: 10}
