kind: esquema
esquema: composicion
version: 1
descripcion: que roles se materializan para una clase de trabajo concreta, y cuales se combinan o se separan
obligatorios: [id, capacidad, clase_de_trabajo, condicion, roles, combinables, independientes, ampliacion, reduccion, retirada]
campos:
  id: {tipo: texto, patron: '^composicion:[a-z0-9-]+$'}
  capacidad: {tipo: ref, ref_a: capacidad}
  clase_de_trabajo: {tipo: texto, min: 5}
  condicion: {tipo: texto, min: 20}
  roles:
    tipo: lista
    min: 1
    de: objeto
    obligatorios: [rol, obligatorio, agentes]
    campos:
      rol: {tipo: ref, ref_a: rol}
      obligatorio: {tipo: booleano}
      agentes: {tipo: texto, min: 1}
      condicion: {tipo: texto}
  combinables:
    tipo: lista
    de: objeto
    obligatorios: [roles, motivo]
    campos:
      roles: {tipo: lista, de: ref, ref_a: rol, min: 2}
      motivo: {tipo: texto, min: 15}
      condicion: {tipo: texto}
  independientes:
    tipo: lista
    min: 1
    de: objeto
    obligatorios: [rol, de, motivo]
    campos:
      rol: {tipo: ref, ref_a: rol}
      de: {tipo: lista, de: texto, min: 1}
      motivo: {tipo: texto, min: 15}
  ampliacion: {tipo: texto, min: 20}
  reduccion: {tipo: texto, min: 20}
  retirada: {tipo: texto, min: 20}
