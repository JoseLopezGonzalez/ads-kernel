kind: esquema
esquema: integration-set
version: 1
descripcion: combinacion exacta de revisiones de fuentes que ha sido candidata o probada conjuntamente; es atomicidad LOGICA de producto, no atomicidad Git
obligatorios: [id, item, estado, fuentes, verificacion, restaura_a]
campos:
  id: {tipo: texto, patron: '^IS-[0-9]{3,}$'}
  item: {tipo: texto, min: 5}
  # candidato    la combinacion existe y todavia no se ha verificado entera
  # verificado   toda la verificacion declarada tiene resultado y evidencia
  # integrado    todas sus fuentes estan integradas en su rama principal
  # parcial      una o mas fuentes quedaron sin integrar. NO es terminado
  # descartado   se abandono; se conserva porque explica por que existe el siguiente
  estado: {tipo: enum, valores: [candidato, verificado, integrado, parcial, descartado]}
  fuentes:
    tipo: lista
    min: 1
    de: objeto
    obligatorios: [source, commit]
    campos:
      # el id declarado en SOURCES.toml. NO la ruta local: la ruta no es identidad.
      source: {tipo: texto, min: 1}
      # un SHA concreto. Una rama se mueve, y entonces el conjunto deja de ser exacto.
      commit: {tipo: texto, patron: '^[0-9a-f]{7,40}$'}
      rama: {tipo: texto}
      pr: {tipo: texto}
  contratos: {tipo: lista, de: texto}
  verificacion:
    tipo: lista
    min: 1
    de: objeto
    obligatorios: [ambito, resultado, evidencia]
    campos:
      ambito: {tipo: texto, min: 3}
      resultado: {tipo: enum, valores: [pendiente, pasa, falla, no-aplica]}
      evidencia: {tipo: texto, min: 5}
  migraciones: {tipo: lista, de: texto}
  # a que combinacion se vuelve si hay que revertir el producto. Sin esto, revertir es
  # una arqueologia por varios historiales que nadie hace bajo presion.
  restaura_a: {tipo: texto, min: 5}
  # Directiva §71: cuando el bloque toca VARIAS fuentes, el conjunto define ademas el orden
  # de merge, la compatibilidad entre revisiones, el despliegue y las dependencias; el Owner
  # abre un unico informe de integracion y lo encuentra todo. Con una sola fuente son
  # triviales y se omiten. Lo exige `oficina._exigir_integration_set` (T497).
  # los `source` del conjunto, TODOS y UNA vez, en el orden en que se fusionan
  orden_de_merge: {tipo: lista, de: texto}
  compatibilidad:
    tipo: lista
    de: objeto
    obligatorios: [entre, condicion]
    campos:
      entre: {tipo: lista, de: texto, min: 2}
      # p. ej. "el frontend tolera la API anterior y la nueva: el backend puede ir antes"
      condicion: {tipo: texto, min: 5}
      comprobado_por: {tipo: texto}
  despliegue:
    tipo: lista
    de: objeto
    obligatorios: [source, orden]
    campos:
      source: {tipo: texto, min: 1}
      orden: {tipo: entero, min: 1}
      como: {tipo: texto}
      condicion: {tipo: texto}
  dependencias: {tipo: lista, de: texto}
  # Directiva §74 · LAS NUEVE SALVAGUARDAS «mientras se valide en produccion». Cuatro ya
  # tenian sitio —PRs integrables y reversibles en `fuentes`+`restaura_a`, migraciones en
  # `migraciones`, no mezclar cambios no relacionados en `item`, plan de rollback en
  # `restaura_a`—. Las otras CINCO no eran campo ni checklist de ningun sitio, asi que el
  # conjunto podia declararse completo sin haberlas respondido nunca.
  #
  # DECISION · una LISTA de respuestas, no cinco campos sueltos
  #   Alternativas: (a) un campo por salvaguarda; (b) una lista con `id` y `respuesta`.
  #   Se elige (b), la misma forma que la `autoevaluacion` de la entrega. Con (a) anadir una
  #   salvaguarda seria cambiar el esquema y migrar los conjuntos escritos; con (b) el
  #   universo de ids es cerrado y lo comprueba el validador, que es donde tiene que estar.
  #
  # DECISION · `no-aplica` EXISTE, y por eso hay que escribirlo
  #   Un conjunto de una sola fuente sin datos no necesita estrategia de recuperacion, y
  #   obligar a un `si` falso seria peor que no preguntar. Lo que NO se admite es el
  #   silencio: responder `no-aplica` deja a alguien diciendolo con su nombre.
  salvaguardas:
    tipo: lista
    de: objeto
    obligatorios: [id, respuesta]
    campos:
      id:
        tipo: enum
        valores: [migraciones-backward-compatible, rollout-incremental, feature-flags,
                  observabilidad, comprobacion-post-deploy, estrategia-de-recuperacion-de-datos]
      respuesta: {tipo: enum, valores: [si, no, no-aplica]}
      # por que. Un `no-aplica` sin motivo es un silencio con otro nombre.
      motivo: {tipo: texto}
      evidencia: {tipo: texto}
