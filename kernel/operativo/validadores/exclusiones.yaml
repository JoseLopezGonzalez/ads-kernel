# Qué queda FUERA de la comprobación de referencias, y por qué.
#
# Hallazgo A-05: la comprobación anterior decidía que un documento tenía enlace entrante
# buscando su NOMBRE BASE como subcadena en cualquier otro fichero. Con 43 nombres
# repetidos que cubrían 119 de 188 documentos, la comprobación estaba desactivada de hecho
# para dos tercios del corpus, y nadie lo había declarado.
#
# Esta lista es la respuesta: si algo queda fuera, se escribe aquí, con su motivo, y el
# validador la publica en cada ejecución. Una exclusión sin motivo es un fallo. Una
# exclusión cuyo objetivo ya no existe, también: no se acumulan restos.

no_analizados:
  # No forman parte del corpus vigente. Se conservan por trazabilidad.
  - ruta: packs/legacy-1.3.0
    motivo: >
      Los tres packs de la línea 1.3.0, retirados por la decisión D3. Se conservan para
      poder leer qué decía cada uno antes de su retirada. No se instalan y nada del corpus
      vigente debe enlazarlos.
  - ruta: docs/rediseno/a-EQUIPOS-v1-RECHAZADA.md
    motivo: "versión rechazada del rediseño; se conserva para trazabilidad de (a)"
  - ruta: docs/rediseno/a-EQUIPOS-v2-RECHAZADA.md
    motivo: "versión rechazada del rediseño; se conserva para trazabilidad de (a)"
  - ruta: docs/rediseno/a-EQUIPOS-v3-SUPERADA.md
    motivo: "versión superada del rediseño; se conserva para trazabilidad de (a)"
  - ruta: kernel/operativo/pruebas/fixtures
    motivo: >
      Material de prueba, no corpus. Contiene infracciones y valores deliberados que
      existen para hacer fallar a un validador; tratarlos como contenido produciría
      hallazgos falsos. Los consume T149.

puntos_de_entrada:
  # Documentos a los que se llega SIN enlace, porque son por donde se entra. Quedan
  # exentos de la regla de documento huérfano, y sólo de esa: sus enlaces salientes se
  # comprueban como los de cualquier otro.
  - ruta: README.md
    motivo: "portada del repositorio: es el primer fichero que alguien abre"
  - ruta: START_HERE.md
    motivo: "procedimiento de arranque; el README manda leerlo y se copia a cada proyecto"
  - ruta: kernel/BOOTSTRAP_PROMPT.md
    motivo: >
      Se PEGA en un agente, no se enlaza desde el corpus. START_HERE lo nombra en el paso 6
      como contenido que el Owner copia.
  - ruta: kernel/operativo/pruebas/REGISTRO-generado.md
    motivo: >
      Artefacto generado por registro_pruebas.py. REGISTRO.md lo enlaza, pero se declara
      aquí para que su ausencia de enlaces entrantes nunca se lea como un descuido.

generados:
  # Se regeneran desde una fuente canónica. Editarlos a mano es el defecto.
  - ruta: kernel/operativo/pruebas/REGISTRO-generado.md
    fuente: "los bloques ads:escenario del corpus, vía validadores/registro_pruebas.py"
  - ruta: kernel/operativo/pruebas/RECUENTOS-generado.md
    fuente: "el corpus, vía validadores/comprobar_recuentos.py"

vocabulario_exento:
  # Documentos APROBADOS que no se reescriben. Su vocabulario quedó fijado el día que el
  # Owner los aprobó, y corregirlo ahora sería reescribir un texto normativo como si
  # siempre hubiera dicho otra cosa. Sus ENLACES sí se comprueban.
  - ruta: docs/rediseno/a-CAPACIDADES-APROBADA.md
    motivo: "sección (a), aprobada el 2026-08-25; se enmienda por E1, no se reescribe"
  - ruta: docs/rediseno/b-RECORRIDO-APROBADA.md
    motivo: "sección (b), aprobada el 2026-08-25; no se ha enmendado"
  - ruta: docs/rediseno/00-MAPA.md
    motivo: "mapa del kernel 1.3.0 frente al principio gobernante; documento histórico"
  - ruta: docs/rediseno/README.md
    motivo: "índice del rediseño; cita el vocabulario de las secciones que enumera"
  - ruta: docs/rediseno/REVISION-ADVERSARIAL.md
    motivo: "informe cerrado de la revisión anterior; se conserva tal como se escribió"
  - ruta: docs/rediseno/DECISIONES-Y-CONTRADICCIONES.md
    motivo: "registro de decisiones cerradas; reescribirlo borraría su trazabilidad"
  - ruta: docs/rediseno/AUDITORIA-INDEPENDIENTE-LOCAL.md
    motivo: "informe de auditoría entregado; cita el vocabulario que encontró"
  - ruta: kernel/KERNEL.md
    motivo: "constitución en prosa de la línea 1.3, congelada hasta que el runtime exista"
  - ruta: kernel/PROFILE_TEMPLATE.md
    motivo: "plantilla que el Owner rellena en prosa libre, no contrato operativo"
  - ruta: kernel/BOOTSTRAP_PROMPT.md
    motivo: "texto que se pega en un agente; su redacción es deliberada"
  - ruta: docs/evolucion/ADS-NEXT-OWNER-BRIEF.md
    motivo: >
      Directiva del Owner, escrita en su voz. Es material normativo de primer orden y NO
      es corpus operativo: corregir su vocabulario para que cumpliera la regla de condición
      comprobable sería reescribir la orden. Sus ENLACES sí se comprueban.
  - ruta: docs/evolucion/PROMPT-ARRANQUE-ADS-NEXT.md
    motivo: >
      El prompt con el que el Owner ordena ejecutar la directiva. Se conserva literal por el
      mismo motivo: es la orden, no una descripción de la orden.
  - ruta: ADS-ARQUITECTURA-MULTIREPO-APROBADA.md
    motivo: >
      Decisión de arquitectura del Owner, aprobada para implementación, escrita en su voz.
      Es material normativo de primer orden y no corpus operativo. Tercera vez que un
      documento del Owner entra sin sitio declarado: registrado como problema P-07.
  - ruta: ADS-IDEAS-PENDIENTES-MULTIREPO.md
    motivo: >
      Documento de trabajo del Owner: ideas consolidadas y cuestiones abiertas. Se conserva
      literal porque su valor está en lo que declara ABIERTO, y reescribirlo cerraría por
      redacción lo que el Owner dejó sin decidir.
  - ruta: docs/evolucion/ADS-PENDIENTES-DE-IMPLEMENTACION-Y-DISCUSION.md
    motivo: >
      Documento vivo de trabajo con el Owner: decisiones suyas ya aceptadas, propuestas
      todavía pendientes y problemas que F3 debe sintetizar. Se conserva literal por el
      mismo motivo que IDEAS: su valor está en lo que declara ACEPTADO y en lo que declara
      ABIERTO, y reescribir su vocabulario cerraría por redacción lo que el Owner dejó sin
      decidir. Sus ENLACES sí se comprueban. Es MATERIAL TEMPORAL de evolución: el gate de
      higiene del corpus que su propio §26.25 propone alcanza a este fichero, y su
      exclusión se retira cuando el fichero se retire. Quinta ocurrencia de P-07.
